name: OhMyAndroid
options:
  bundleIdPrefix: se.royan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Ad-hoc signing so anyone can build and run. Scripts/release.sh signs with a Developer ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # Notarization rejects get-task-allow and signatures without a secure timestamp.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  OhMyAndroid:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["MCP/**"]
    dependencies:
      # The MCP server ships inside the app: Contents/MacOS/ohmyandroid-mcp, signed with it.
      - target: ohmyandroid-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Oh My Android
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Royan AB. MIT License."
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Design image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg]
    entitlements:
      path: Sources/App/OhMyAndroid.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.royan.ohmyandroid
        PRODUCT_NAME: Oh My Android
        PRODUCT_MODULE_NAME: OhMyAndroid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES

  # MCP server for AI agents. Shares Core and Features with the app; Imaging needs AppKit and stays out.
  ohmyandroid-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Core
        excludes: ["Imaging/**"]
      - path: Sources/Features
      - path: Sources/MCP
    settings:
      base:
        PRODUCT_NAME: ohmyandroid-mcp
        PRODUCT_MODULE_NAME: OhMyAndroidMCP
        PRODUCT_BUNDLE_IDENTIFIER: se.royan.ohmyandroid.mcp
        # Embedded Info.plist: gives the binary a stable signing identifier and a version.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

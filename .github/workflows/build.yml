name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes the running build moot.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (warnings are errors)
        run: |
          xcodebuild -project OhMyAndroid.xcodeproj -scheme OhMyAndroid -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- build
      - name: Test MCP server protocol
        run: Scripts/test-mcp.py "build/DerivedData/Build/Products/Release/Oh My Android.app/Contents/MacOS/ohmyandroid-mcp"
